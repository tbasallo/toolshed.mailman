# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish to Nuget

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)

    steps:
    - name: Check out Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Calculate version
      id: version
      run: |
        MAJOR=10
        MINOR=1
        PATCH=$(git rev-list --count HEAD)
        VERSION="$MAJOR.$MINOR.$PATCH"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Calculated version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore Toolshed.Mailman/Toolshed.Mailman.csproj

    - name: Build
      run: dotnet build Toolshed.Mailman/Toolshed.Mailman.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Pack
      run: dotnet pack Toolshed.Mailman/Toolshed.Mailman.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: NuGet login
      if: github.event_name == 'push'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      if: github.event_name == 'push'
      run: dotnet nuget push Toolshed.Mailman/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Restore dependencies (AwsSes)
      run: dotnet restore Toolshed.Mailman.AwsSes/Toolshed.Mailman.AwsSes.csproj

    - name: Build (AwsSes)
      run: dotnet build Toolshed.Mailman.AwsSes/Toolshed.Mailman.AwsSes.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Pack (AwsSes)
      run: dotnet pack Toolshed.Mailman.AwsSes/Toolshed.Mailman.AwsSes.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Publish to NuGet (AwsSes)
      if: github.event_name == 'push'
      run: dotnet nuget push Toolshed.Mailman.AwsSes/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
